<html>
<head>
   
</head>
<body>
    <div>
        <input id="city" placeholder="Enter Your City">
        <button onclick="getweather()">Search</button>
        <p id="result"></p>
    </div>
    <script>
        async function getweather() 
        {
            let city = document.getElementById("city").value;
            let geoAPI = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${city}`);
            let geodata = await geoAPI.json();
            if(!geodata.results)
            {
                document.getElementById("result").innerHTML = "City Not Found";
                return;
            }
            let lat = geodata.results[0].latitude;
            let lon = geodata.results[0].longitude;
            let weatherapi = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
            let weather = await weatherapi.json();
            document.getElementById("result").innerHTML=`Temp:${weather.current_weather.temperature}`;
        }
    </script>
</body>
